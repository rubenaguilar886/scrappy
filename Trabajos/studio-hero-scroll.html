<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scrappy Studio — Ya generaste interés</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; }

    body {
      font-family: 'Sora', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(160deg, #D6D4D0 0%, #E4E2DE 35%, #DDDBD7 65%, #CECCC8 100%);
      color: #0D0D0D;
      overflow-x: hidden;
    }

    /* ── Scroll wrapper — 500vh ── */
    #scroll-wrap { height: 500vh; position: relative; }

    /* ── Sticky hero ─────────────────────────────── */
    #hero {
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      align-items: stretch;
      overflow: hidden;
      background: linear-gradient(160deg, #D6D4D0 0%, #E4E2DE 35%, #DDDBD7 65%, #CECCC8 100%);
    }

    /* ── Two-column inner ────────────────────────── */
    .inner {
      display: flex;
      align-items: stretch;
      width: 100%;
      padding: 0;
      gap: 0;
    }

    /* ── Left ────────────────────────────────────── */
    .col-left {
      flex: 0 0 auto;
      width: clamp(300px, 42vw, 560px);
      padding: 0 3rem 0 6%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      z-index: 2;
      flex-shrink: 0;
    }

    .kicker {
      display: inline-block;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: #9CA3AF;
      margin-bottom: 1.8rem;
    }

    .hero-h1 {
      font-size: clamp(2rem, 4.2vw, 3.6rem);
      font-weight: 500;
      line-height: 1.08;
      letter-spacing: -.03em;
      color: #111;
      margin-bottom: 1.4rem;
    }

    .hero-sub {
      font-size: clamp(.9rem, 1.3vw, 1.05rem);
      line-height: 1.65;
      color: #6B7280;
      max-width: 460px;
      margin-bottom: 2.4rem;
    }

    /* ── CTA ─────────────────────────────────────── */
    .cta-row { display: flex; align-items: center; gap: .9rem; flex-wrap: wrap; }

    .roll-clip  { overflow:hidden; display:inline-flex; height:20px; line-height:20px; vertical-align:middle; }
    .roll-inner { display:flex; flex-direction:column; line-height:20px; transition:transform .5s cubic-bezier(.25,.1,.25,1); }
    .roll-btn:hover .roll-inner { transform:translateY(-50%); }
    .roll-arrow { transform:rotate(-45deg); transition:transform .5s cubic-bezier(.25,.1,.25,1); display:block; }
    .roll-btn:hover .roll-arrow { transform:rotate(0deg); }

    .btn-grad {
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      padding: .45rem .45rem .45rem 1.3rem;
      border-radius: 9999px;
      background: linear-gradient(135deg, #EC4899, #7C3AED, #22D3EE);
      color: #fff !important;
      font-size: .85rem;
      font-weight: 500;
      text-decoration: none;
      transition: opacity .2s, transform .2s;
    }
    .btn-grad:hover { opacity: .88; transform: translateY(-1px); }

    .btn-icon {
      width: 1.9rem; height: 1.9rem;
      border-radius: 9999px; background: #fff;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .badge-pill {
      display: inline-flex; align-items: center; gap: .45rem;
      padding: .55rem .9rem; border-radius: 9999px;
      background: rgba(0,0,0,.07);
      font-size: .78rem; font-weight: 500; color: #374151;
    }
    .badge-accent {
      background: linear-gradient(135deg, #EC4899, #7C3AED, #22D3EE);
      color: #fff; padding: .18rem .55rem; border-radius: 9999px;
      font-size: .68rem; font-weight: 500;
    }

    /* ── Right — video wrapper ───────────────────── */
    .col-right {
      flex: 1 1 0;
      min-width: 0;
      position: relative;
      align-self: stretch;
      overflow: hidden;
      /* fade left edge into background */
      -webkit-mask-image: linear-gradient(to right, transparent 0%, rgba(0,0,0,.55) 8%, black 18%);
      mask-image: linear-gradient(to right, transparent 0%, rgba(0,0,0,.55) 8%, black 18%);
    }

    #hero-video {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0; left: 0;
      object-fit: cover;
      pointer-events: none;
      transform: translateZ(0);
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      image-rendering: high-quality;
    }

    /* ── Progress bar ────────────────────────────── */
    #progress-bar {
      position: fixed; top: 0; left: 0;
      height: 2px; width: 0%;
      background: linear-gradient(90deg, #EC4899, #7C3AED, #22D3EE);
      z-index: 100;
      pointer-events: none;
    }

    /* ── Scroll hint ─────────────────────────────── */
    .scroll-hint {
      position: fixed; bottom: 2.2rem; left: 50%;
      transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; gap: .4rem;
      font-size: .65rem; letter-spacing: .18em; text-transform: uppercase;
      color: #9CA3AF; pointer-events: none;
      transition: opacity .6s; z-index: 10;
    }
    .scroll-hint.fade { opacity: 0; }
    .hint-line {
      width: 1px; height: 28px;
      background: linear-gradient(to bottom, transparent, #9CA3AF);
      overflow: hidden; position: relative;
    }
    .hint-line::after {
      content: ''; position: absolute; top: -100%; left: 0;
      width: 100%; height: 100%; background: #9CA3AF;
      animation: drip 1.6s ease-in-out infinite;
    }
    @keyframes drip { 0% { top: -100%; } 100% { top: 200%; } }

    /* ── Below fold ──────────────────────────────── */
    .below-fold {
      min-height: 60vh; display: flex;
      align-items: center; justify-content: center;
      background: #fff; color: #9CA3AF;
      font-size: .8rem; letter-spacing: .12em; text-transform: uppercase;
    }
  </style>
</head>
<body>

<div id="progress-bar"></div>

<div id="scroll-wrap">
  <div id="hero">
    <div class="inner">

      <!-- Left: copy -->
      <div class="col-left">
        <span class="kicker">Scrappy Studio</span>
        <h1 class="hero-h1">
          Ya generaste interés.<br>
          Haz que te elijan a ti.
        </h1>
        <p class="hero-sub">
          Diseñamos webs que generan confianza en el momento más importante:
          cuando el cliente compara opciones antes de comprar.
        </p>
        <div class="cta-row">
          <a href="https://wa.me/51960248066?text=Hola%2C%20quiero%20cotizar%20una%20p%C3%A1gina%20web%20para%20mi%20negocio"
             target="_blank" rel="noopener" class="btn-grad roll-btn">
            <span class="roll-clip">
              <span class="roll-inner">
                <span>Quiero mi web</span><span aria-hidden>Quiero mi web</span>
              </span>
            </span>
            <span class="btn-icon">
              <svg class="roll-arrow" width="13" height="13" viewBox="0 0 24 24"
                   fill="none" stroke="#7C3AED" stroke-width="2.5"
                   stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"/>
                <polyline points="12 5 19 12 12 19"/>
              </svg>
            </span>
          </a>
          <div class="badge-pill">
            ⚡ Entrega en 10 días
            <span class="badge-accent">Sin mensualidades</span>
          </div>
        </div>
      </div>

      <!-- Right: scroll-driven video -->
      <div class="col-right">
        <video id="hero-video"
               src="./hero-scroll.mp4"
               preload="auto"
               muted
               playsinline>
        </video>
      </div>

    </div>
  </div>
</div>

<div class="below-fold">↓ Sigue explorando</div>

<div class="scroll-hint" id="scroll-hint">
  Scroll <span class="hint-line"></span>
</div>

<script>
(function () {
  'use strict';

  var video     = document.getElementById('hero-video');
  var wrap      = document.getElementById('scroll-wrap');
  var hint      = document.getElementById('scroll-hint');
  var bar       = document.getElementById('progress-bar');

  /* no mouse parallax — video stays fixed */

  /* ── Scroll scrub ───────────────────────────── */
  var scrollProgress  = 0;
  var currentProgress = 0;
  var hinted = false;

  window.addEventListener('scroll', function () {
    var maxScroll = wrap.scrollHeight - window.innerHeight;
    if (maxScroll <= 0) return;
    scrollProgress = Math.max(0, Math.min(1, window.scrollY / maxScroll));
    bar.style.width = (scrollProgress * 100) + '%';
    if (!hinted && window.scrollY > 30) {
      hint.classList.add('fade');
      hinted = true;
    }
  }, { passive: true });

  /* ── Seek state ─────────────────────────────── */
  var isSeeking  = false;
  var lastTarget = -1;
  video.addEventListener('seeked', function () { isSeeking = false; });

  /* ── RAF loop ───────────────────────────────── */
  function animate() {
    requestAnimationFrame(animate);

    /* Smooth scroll easing */
    currentProgress += (scrollProgress - currentProgress) * 0.08;

    /* Seek */
    if (!isSeeking && video.readyState >= 2 && video.duration > 0) {
      var target = currentProgress * video.duration;
      if (Math.abs(target - lastTarget) > 0.025) {
        isSeeking  = true;
        lastTarget = target;
        video.currentTime = target;
      }
    }
  }

  animate();
  video.load();

})();
</script>

</body>
</html>
