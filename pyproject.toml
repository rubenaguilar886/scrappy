[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scrappy"
version = "0.1.0"
description = "Scraper de directorios de negocios (Google Maps, Páginas Amarillas, etc.)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40.0",
    "click>=8.1.0",
    "pydantic>=2.5.0",
    "rich>=13.7.0",
]

[project.scripts]
scrappy = "scrappy.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
