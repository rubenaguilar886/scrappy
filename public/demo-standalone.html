<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scrappy Lite — Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=optional" rel="stylesheet">
<style>
  /* ── Variables y base — mismos valores que scrappy-mvp-movil.html ── */
  :root{
    --bg:#ffffff;
    --ink:#042c53;
    --sub:#4a6a8f;
    --accent:#ef9f27;
    --accent-deep:#8f5c0e;
    --accent-soft:#fbe8c8;
    --line:#bcdcf5;
    --card:#e6f1fb;
    --navy:#042c53;
    --navy-deep:#02203d;
    --ok:#2f6b47;
    --ok-soft:#e4efe6;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;background:#eef2f6;color:var(--ink);
    font-family:'IBM Plex Sans',sans-serif;line-height:1.5;
    -webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;
  }
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;margin:0;letter-spacing:-0.01em;}

  /* ── Componentes reales reutilizados de Scrappy Lite ── */
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--sub);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;}
  .field input{
    width:100%;border:1.5px solid var(--line);border-radius:10px;padding:13px 14px;
    font-family:inherit;font-size:15px;background:var(--card);color:var(--ink);
  }
  .field input::placeholder{color:#b8b2a8;}

  .section-label{
    font-size:11.5px;font-weight:600;color:var(--sub);text-transform:uppercase;
    letter-spacing:.05em;margin:0 0 10px;display:flex;align-items:center;gap:6px;
  }
  .section-label svg{width:13px;height:13px;flex:0 0 auto;}

  .btn-search{
    width:100%;padding:15px;border-radius:10px;border:none;background:var(--ink);color:#fff;
    font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }

  .loading{display:none;flex-direction:column;gap:10px;padding:28px 0 8px;color:var(--sub);font-size:13.5px;}
  .loading.show{display:flex;}
  .loading-row{display:flex;align-items:center;justify-content:center;gap:10px;}
  .spinner{width:15px;height:15px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;flex:0 0 auto;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .progress-track{width:100%;height:5px;background:var(--card);border-radius:999px;overflow:hidden;margin:2px 0 8px;}
  .progress-fill{height:100%;width:12%;background:var(--accent);border-radius:999px;transition:width .4s ease;}

  .results-head{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 4px;}
  .results-head h2{font-size:16px;}

  .card{
    background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;
    transition:opacity .2s ease,border-color .15s ease;
  }
  .card.expanded{border-color:var(--ink);}
  .card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .card.expanded .card-top{margin-bottom:8px;}
  .card-left{display:flex;align-items:flex-start;gap:10px;flex:1;min-width:0;}
  .contact-check{
    flex:0 0 auto;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);
    background:#fff;margin-top:1px;display:flex;align-items:center;justify-content:center;
  }
  .contact-check svg{width:12px;height:12px;color:#fff;opacity:0;}
  .card-name{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;}
  .card-category{font-size:11px;color:var(--sub);margin-top:1px;}
  .card-tags{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:0 0 auto;}
  .quality-tag{font-size:10.5px;font-weight:600;background:var(--ok-soft);color:var(--ok);padding:3px 8px;border-radius:999px;white-space:nowrap;}
  .no-web-tag{
    flex:0 0 auto;display:flex;align-items:center;gap:4px;
    font-size:10.5px;font-weight:600;background:var(--accent-soft);color:var(--accent-deep);
    padding:3px 8px;border-radius:999px;white-space:nowrap;
  }
  .no-web-tag svg{width:9px;height:9px;flex:0 0 auto;}
  .expand-chevron{flex:0 0 auto;width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--sub);}
  .expand-chevron svg{width:13px;height:13px;transition:transform .2s ease;}
  .card.expanded .expand-chevron{color:var(--ink);}
  .card.expanded .expand-chevron svg{transform:rotate(90deg);}
  .card-details{display:none;}
  .card.expanded .card-details{display:block;}
  .card-meta{display:flex;gap:12px;font-size:12.5px;color:var(--sub);margin-bottom:12px;flex-wrap:wrap;}
  .channel-tabs{display:flex;gap:6px;margin-bottom:12px;}
  .channel-tab{
    flex:1;padding:8px 6px;border-radius:8px;border:1.5px solid var(--line);
    background:#fff;font-family:inherit;font-size:12px;font-weight:600;color:var(--sub);
  }
  .channel-tab.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .diagnostico-box{background:var(--accent-soft);border:1.5px solid var(--accent);border-radius:8px;padding:12px;margin-bottom:12px;}
  .diagnostico-box p{font-size:11px;font-weight:600;color:var(--accent-deep);text-transform:uppercase;letter-spacing:.04em;margin:0 0 8px;}
  .diagnostico-box ul{margin:0;padding-left:16px;}
  .diagnostico-box li{font-size:12.5px;color:var(--accent-deep);line-height:1.5;margin-bottom:4px;}
  .copy-inline{background:none;border:none;color:var(--sub);font-size:11.5px;font-weight:600;cursor:pointer;text-decoration:underline;font-family:inherit;}
  .msg-toggle{
    width:100%;text-align:left;background:none;border:none;padding:0;
    font-family:'IBM Plex Sans',sans-serif;font-size:12.5px;font-weight:600;color:var(--accent-deep);cursor:pointer;
    display:flex;align-items:center;gap:5px;
  }
  .msg-toggle svg{width:11px;height:11px;transition:transform .2s ease;}
  .msg-toggle.open svg{transform:rotate(90deg);}
  .msg-body{max-height:0;overflow:hidden;transition:max-height .25s ease;}
  .msg-body.open{max-height:1000px;}
  .msg-text{margin-top:10px;padding:12px;background:#eef2f6;border-radius:8px;font-size:13px;color:var(--navy);line-height:1.5;white-space:pre-wrap;}

  /* ── Marco de celular + cursor animado ── */
  .phone-frame{
    background:#0b0f1a;border-radius:40px;padding:16px 11px;
    box-shadow:0 24px 60px rgba(4,44,83,.28);position:relative;
  }
  .phone-frame__notch{
    position:absolute;top:16px;left:50%;transform:translateX(-50%);
    width:84px;height:16px;border-radius:0 0 12px 12px;background:#0b0f1a;z-index:5;
  }
  .demo-app{
    position:relative;width:300px;height:650px;aspect-ratio:9/19.5;
    background:var(--bg);border-radius:24px;overflow:hidden;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);
  }
  .demo-scene{display:none;position:absolute;inset:0;overflow:hidden;text-align:left;}
  .demo-scene.is-active{display:block;}
  .demo-scene .pad{padding:16px 14px;}
  .demo-cursor{
    position:absolute;width:16px;height:16px;border-radius:50%;
    background:rgba(239,159,39,.9);border:2px solid #fff;
    transform:translate(-50%,-50%);
    transition:left .55s cubic-bezier(.4,0,.2,1),top .55s cubic-bezier(.4,0,.2,1),opacity .25s ease;
    pointer-events:none;z-index:20;opacity:0;box-shadow:0 2px 6px rgba(0,0,0,.35);
  }
  .demo-cursor.is-active{opacity:1;}
  .demo-cursor.is-clicking{animation:demoCursorClick .28s ease;}
  @keyframes demoCursorClick{
    0%{transform:translate(-50%,-50%) scale(1);}
    50%{transform:translate(-50%,-50%) scale(.55);}
    100%{transform:translate(-50%,-50%) scale(1);}
  }
  .demo-btn-flash{animation:demoBtnFlash .3s ease;}
  @keyframes demoBtnFlash{0%{filter:brightness(1);}50%{filter:brightness(1.3);}100%{filter:brightness(1);}}
  .demo-toast{
    position:absolute;left:50%;bottom:14px;transform:translate(-50%,16px);
    background:var(--ink);color:#fff;font-size:11.5px;font-weight:600;
    padding:8px 14px;border-radius:20px;opacity:0;transition:all .3s ease;
    pointer-events:none;white-space:nowrap;z-index:15;
  }
  .demo-toast.show{opacity:1;transform:translate(-50%,0);}
</style>
</head>
<body>

  <div class="phone-frame">
    <div class="phone-frame__notch"></div>
    <div class="demo-app" id="demoApp">
      <div class="demo-cursor" id="demoCursor"></div>

      <!-- Escena 1: búsqueda -->
      <div class="demo-scene is-active" id="demoScene1">
        <div class="pad">
          <p class="section-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            Qué y dónde buscar
          </p>
          <div class="field">
            <label>Rubro</label>
            <input type="text" id="demoRubro" placeholder="Ej. Tatuajes, veterinarias, spas" readonly>
          </div>
          <div class="field">
            <label>Distrito, ciudad</label>
            <input type="text" id="demoCiudad" placeholder="Ej. Miraflores, Lima" readonly>
          </div>
          <button class="btn-search" id="demoBtnBuscar" style="margin-top:6px;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            Buscar prospectos
          </button>
        </div>
      </div>

      <!-- Escena 2: cargando -->
      <div class="demo-scene" id="demoScene2">
        <div class="pad">
          <div class="loading show" style="display:block;">
            <div class="loading-row">
              <div class="spinner"></div>
              <span>Buscando en Google Maps...</span>
            </div>
            <div class="progress-track"><div class="progress-fill" id="demoProgress" style="width:0%"></div></div>
          </div>
        </div>
      </div>

      <!-- Escena 3: resultados + mensaje -->
      <div class="demo-scene" id="demoScene3">
        <div class="pad">
          <div class="results-head" style="margin-bottom:10px;">
            <h2 style="font-size:16px;">3 negocios encontrados</h2>
          </div>
          <div id="demoCardsList"></div>
        </div>
        <div class="demo-toast" id="demoToast">✓ Mensaje copiado</div>
      </div>
    </div>
  </div>

<script>
(function () {
  'use strict';

  var demoApp    = document.getElementById('demoApp');
  var cursor     = document.getElementById('demoCursor');
  var scene1 = document.getElementById('demoScene1');
  var scene2 = document.getElementById('demoScene2');
  var scene3 = document.getElementById('demoScene3');
  var demoRubro   = document.getElementById('demoRubro');
  var demoCiudad  = document.getElementById('demoCiudad');
  var demoBtn     = document.getElementById('demoBtnBuscar');
  var demoProgress = document.getElementById('demoProgress');
  var demoCardsList = document.getElementById('demoCardsList');
  var demoToast   = document.getElementById('demoToast');

  var DEMO_BUSINESSES = [
    {
      name: 'Veterinaria San Miguel', category: 'Veterinaria', distrito: 'Miraflores',
      rating: '4.6', reviews: '82', quality: 'Excelente prospecto',
      diagnostico: [
        'Tiene 4.6★ con 82 reseñas pero no aparece con web propia — está perdiendo búsquedas directas.',
        'Su categoría suele convertir bien con presencia digital básica.'
      ],
      mensaje: 'Hola! Vi que Veterinaria San Miguel tiene muy buena reputación en Miraflores (4.6★, 82 reseñas) pero no encontré su web. Ayudo a negocios como el suyo a aprovechar mejor ese interés que ya generan online. ¿Conversamos 5 min?'
    },
    {
      name: 'Pet Spa Lima', category: 'Veterinaria', distrito: 'Miraflores',
      rating: '4.8', reviews: '54', quality: '',
      diagnostico: [
        '4.8★ con 54 reseñas — calificación muy alta, buen momento para reforzar su presencia.'
      ],
      mensaje: 'Hola equipo de Pet Spa! Su calificación de 4.8★ llama la atención. Ayudo a negocios así a convertir ese buen nombre en más clientes nuevos. ¿Les interesa ver cómo?'
    },
    {
      name: 'Huellitas Vet Clinic', category: 'Veterinaria', distrito: 'Miraflores',
      rating: '4.5', reviews: '31', quality: 'Buen prospecto',
      diagnostico: [
        '31 reseñas y 4.5★ — base sólida para empezar a atraer más pacientes por internet.'
      ],
      mensaje: 'Hola! Vi el perfil de Huellitas Vet Clinic en Miraflores, 4.5★. Ayudo a clínicas como la suya a conseguir más citas desde internet. ¿Te cuento cómo en un mensaje corto?'
    }
  ];

  function esc(s) {
    return String(s || '').replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function cardHtml(biz, idx) {
    var qualityTag = biz.quality ? '<div class="quality-tag">' + esc(biz.quality) + '</div>' : '';
    return (
      '<div class="card" id="demoCard' + idx + '">' +
        '<div class="card-top">' +
          '<div class="card-left">' +
            '<div class="contact-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12l4 4 10-10"/></svg></div>' +
            '<div>' +
              '<div class="card-name">' + esc(biz.name) + '</div>' +
              '<div class="card-category">' + esc(biz.category) + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="card-tags">' +
            '<div class="no-web-tag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><circle cx="12" cy="12" r="9"/><path d="M4.5 4.5l15 15"/></svg>Sin web</div>' +
            qualityTag +
          '</div>' +
          '<div class="expand-chevron"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M9 18l6-6-6-6"/></svg></div>' +
        '</div>' +
        '<div class="card-details">' +
          '<div class="card-meta"><span>' + biz.rating + '★ (' + biz.reviews + ')</span><span>' + esc(biz.distrito) + '</span></div>' +
          '<button class="msg-toggle">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M9 18l6-6-6-6"/></svg>' +
            'Ver diagnóstico y mensajes' +
          '</button>' +
          '<div class="msg-body">' +
            '<div class="diagnostico-content">' +
              '<div class="diagnostico-box"><p>Diagnóstico para vender</p><ul>' +
                biz.diagnostico.map(function (d) { return '<li>' + esc(d) + '</li>'; }).join('') +
              '</ul></div>' +
            '</div>' +
            '<div class="channel-tabs">' +
              '<button type="button" class="channel-tab active">WhatsApp</button>' +
              '<button type="button" class="channel-tab">Email</button>' +
              '<button type="button" class="channel-tab">Instagram</button>' +
            '</div>' +
            '<div class="outreach-content">' +
              '<button type="button" class="copy-inline" style="float:right;">Copiar</button>' +
              '<div class="msg-text">' + esc(biz.mensaje) + '</div>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }

  var pending = null;
  function sleep(ms) {
    return new Promise(function (resolve) { pending = setTimeout(resolve, ms); });
  }

  function moveCursorTo(el) {
    if (!el) return;
    var target = el.getBoundingClientRect();
    var container = demoApp.getBoundingClientRect();
    cursor.style.left = (target.left - container.left + target.width / 2) + 'px';
    cursor.style.top = (target.top - container.top + target.height / 2) + 'px';
    cursor.classList.add('is-active');
  }

  function clickFx(el) {
    cursor.classList.add('is-clicking');
    setTimeout(function () { cursor.classList.remove('is-clicking'); }, 280);
    if (el) {
      el.classList.add('demo-btn-flash');
      setTimeout(function () { el.classList.remove('demo-btn-flash'); }, 300);
    }
  }

  function showScene(scene) {
    [scene1, scene2, scene3].forEach(function (s) { s.classList.remove('is-active'); });
    scene.classList.add('is-active');
  }

  function typeInto(input, text) {
    return new Promise(function (resolve) {
      var i = 0;
      input.value = '';
      var iv = setInterval(function () {
        input.value += text[i];
        i++;
        if (i >= text.length) { clearInterval(iv); resolve(); }
      }, 45);
      pending = iv;
    });
  }

  async function runDemo() {
    while (true) {
      showScene(scene1);
      demoRubro.value = '';
      demoCiudad.value = '';
      cursor.classList.remove('is-active');
      await sleep(500);

      moveCursorTo(demoRubro);
      await sleep(400);
      await typeInto(demoRubro, 'Veterinarias');

      moveCursorTo(demoCiudad);
      await sleep(350);
      await typeInto(demoCiudad, 'Miraflores, Lima');

      await sleep(300);
      moveCursorTo(demoBtn);
      await sleep(450);
      clickFx(demoBtn);
      await sleep(400);

      showScene(scene2);
      demoProgress.style.width = '0%';
      await sleep(150);
      demoProgress.style.width = '55%';
      await sleep(500);
      demoProgress.style.width = '100%';
      await sleep(500);

      showScene(scene3);
      demoCardsList.innerHTML = '';
      cursor.classList.remove('is-active');
      for (var i = 0; i < DEMO_BUSINESSES.length; i++) {
        demoCardsList.insertAdjacentHTML('beforeend', cardHtml(DEMO_BUSINESSES[i], i));
        await sleep(220);
      }

      await sleep(500);
      var firstCard = document.getElementById('demoCard0');
      var nameEl = firstCard.querySelector('.card-name');
      moveCursorTo(nameEl);
      await sleep(450);
      clickFx(nameEl);
      firstCard.classList.add('expanded');
      await sleep(500);

      var msgToggle = firstCard.querySelector('.msg-toggle');
      moveCursorTo(msgToggle);
      await sleep(400);
      clickFx(msgToggle);
      msgToggle.classList.add('open');
      firstCard.querySelector('.msg-body').classList.add('open');
      await sleep(700);

      var copyBtn = firstCard.querySelector('.copy-inline');
      moveCursorTo(copyBtn);
      await sleep(400);
      clickFx(copyBtn);
      demoToast.classList.add('show');
      await sleep(1600);
      demoToast.classList.remove('show');

      await sleep(1800);
    }
  }

  runDemo();
})();
</script>
</body>
</html>
